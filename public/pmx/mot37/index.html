<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>mot</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>

    <div>
      <div>
        <div class="toright">
          <div>フレーム間隔</div>
          <input id="step" type="range" min="1" value="1" />
          <div id="stepview"></div>
        </div>

        <div class="toright">
          <div>繰り返し回数</div>
          <input id="repeatnum" type="range" min="1" value="1" max="100" />
          <div id="repeatnumview"></div>
        </div>

        <div class="toright">
          <div>振幅度数</div>
          <input id="ampdeg" type="range" min="-90" value="90" max="90" />
          <div id="ampdegview"></div>
        </div>

        <div>
          <button class="pointer" id="gomotion1">gomotion1</button>
          <button class="pointer" id="gomotion2">gomotion2</button>
          <button class="pointer" id="gomotion3">gomotion3</button>
          <button class="pointer" id="gomotion4">gomotion4</button>
        </div>
        <!--
        <div class="drop" id="decomp">decomp</div>
      -->
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>mot</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>

    <div>
      <div>
        <!--
        <div class="toright">
          <div>フレーム間隔</div>
          <input class="pointer" id="step" type="range" min="1" value="1" />
          <div id="stepview"></div>
        </div>

        <div class="toright">
          <div>繰り返し回数</div>
          <input class="pointer" id="repeatnum" type="range" min="1" value="1" max="100" />
          <div id="repeatnumview"></div>
        </div>
      -->

        <div class="toright">
          <div>ループ秒数</div>
          <input class="pointer" id="loopsec" type="range" min="1" value="1" max="10" />
          <div id="loopsecview"></div>
        </div>

        <div class="toright">
          <div>振幅度数</div>
          <input class="pointer" id="ampdeg" type="range" min="0" value="11" max="90" />
          <div id="ampdegview"></div>
        </div>

        <div class="toright">
          <div>モーション軸タイプ</div>
          <input class="pointer" id="motiontype" type="range" min="0" value="2" max="9" />
          <div id="motiontypeview"></div>
          <div>
            0: x1, 1: x1, 2:, x2 3: x1
          </div>
        </div>

        <div class="toright">
          <div>交差軸タイプ</div>
          <input class="pointer" id="crosstype" type="range" min="0" value="1" max="9" />
          <div id="crosstypeview"></div>
          <div>
            0: 全平, 1: 全曲げ, 2: 細曲げ, 3: 細平
          </div>
        </div>

        <div>
          <label class="pointer"><input type="checkbox" id="usemirror" />ミラー生成する</label>
        </div>

        <div>
          <button class="pointer" id="gomotion1">gomotion1</button>
          <button class="pointer" id="gomotion2">gomotion2</button>
          <button class="pointer" id="gomotion3">gomotion3</button>
          <button class="pointer" id="gomotion4">gomotion4</button>
        </div>

      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>

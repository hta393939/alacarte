<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>model38</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="view"></div>
    <div>
      <button id="selectroot">フォルダを選択する</button>
      <button class="pointer" id="makechar">キャラクタを作成する</button>

      <button id="idmakecylinder">make cylinder 009</button>
      <button id="idmakedia">makedia </button>
      <button id="idmakebox">box 箱</button>
      <br />
      <label class="pt">
        <input class="pt" type="checkbox" id="useradius" />半径変更
      </label>
      <label class="pt">
        <input class="pt" type="checkbox" id="useradiusq" />半径1/4
      </label>     

      <label class="pt">
        <input class="pt" type="checkbox" id="usephyelement" aaachecked />物理使用
      </label>
      <label class="pt">
        <input class="pt" type="checkbox" id="usedynamic" aaachecked />動的
      </label>

      <label class="pt">
        <input class="pt" type="checkbox" id="usefriction" checked />摩擦有り
      </label>

      <label class="pt">
        <input class="pt" type="checkbox" id="useikelement" />IK使用
      </label>
      <!--
      <div class="toright">
        <div>分母</div>
        <input id="denom" type="range" min="1" max="32" value="8" />
        <div id="denomview"></div>
      </div>
    -->
      <div class="toright">
        <div>スケール指数</div>
        <input id="pow2element" type="range" min="-6" max="2" value="-3" step="0.5" />
        <div class="toright">
          <div>1/</div><div id="denomview"></div>
        </div>
        <div class="spacing"></div>
        <div id="scaleview"></div>
      </div>

      <div class="toright">
        <div>長さ半分</div>
        <input id="lenhalf" type="range" min="1" max="20" value="5" />
        <div id="lenhalfview"></div>
      </div>

      <div class="toright">
        <div>ベルト数</div>
        <input id="belt" type="range" min="1" max="20" value="10" />
        <div id="beltview"></div>
      </div>

      <div>
        <select id="tail" class="pt">
          <option value="e" selected>短</option>
          <option value="l">左</option>
          <option value="r">右</option>
          <option value="w">長い</option>
        </select>
      </div>
      
    </div>
    <div>
      <div id="drop" class="drop">ここに . をドロップ</div>
    </div>
    <div class="toright">
      <details open>
        <summary class="pointer">canvast0</summary>
        <canvas id="canvast0"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast1</summary>
        <canvas id="canvast1"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast2</summary>
        <canvas id="canvast2"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast3</summary>
        <canvas id="canvast3"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast4</summary>
        <canvas id="canvast4"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast5</summary>
        <canvas id="canvast5"></canvas>
      </details>
      <details open>
        <summary class="pointer">canvast6</summary>
        <canvas id="canvast6"></canvas>
      </details>
    </div>

    <script src="../../lib/dance/matl.js"></script>
    <script src="../../lib/dance/pmx.js"></script>
    <script src="../../lib/dance/pmdwriter.js"></script>
    <script type="module" src="./index.js"></script>

  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>two cam</title>
    <link rel="stylesheet" href="./index.css" />
    <!-- docs only -->
  </head>
  <body>

    <div>
      <div>
        <div id="innerview">19:02</div>
        <div id="element"></div>
        <button class="largebutton pointer" id="startbutton">全開始</button>
        <button class="largebutton pointer" id="readytwocam">カメラ準備</button>
        <button class="largebutton pointer" id="makesubfolder">サブフォルダ作成</button>
        <button class="largebutton pointer" id="selectfolder">消去つき対象フォルダ選択</button>

        <button hidden class="largebutton pointer" id="act">対象処理</button>
      </div>
      <div>
        <button class="largebutton pointer" id="enumbutton">列挙ボタン</button>
        <input class="pointer" id="zoomnumber" type="range" min="1" max="10" value="1" />
        <span id="zoomnumberview"></span>
        <div id="devices"></div>
      </div>

      <div>
        <label class="largelabel pointer">
        <input id="running" class="pointer" type="checkbox" />キャプチャする
        </label>
        <div id="fpsview"></div>
        <div id="spacing"></div>
        <div id="countview"></div>
      </div>

      <div>
        <video id="environmentvideo" controls muted autoplay playsinline></video>
      </div>
      <div>
        <video id="uservideo" controls muted autoplay playsinline></video>
      </div>

      <div>
        <button class="hugebutton pointer" id="oneshot">1回撮影</button>
      </div>

      <div>
        <div id="console"></div>
      </div>

    </div>

    <script src="./index.js"></script>
  </body>
</html>

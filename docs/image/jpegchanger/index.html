<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>jpeg変更する</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div>

      <div>
        <div id="startfile" class="drop">ここにファイルをドロップ</div>

        <div class="row">
<div>wh</div><div id="whview"></div>
<div class="space"></div>
<div>NF</div><div id="nearfarview"></div>
<div class="space"></div>
<div>focal</div><div id="focalview"></div>
        </div>

        <div>
        <div class="row">
          <!-- 8, 12 -->
分割数<input class="pointer" type="range" id="divnum" value="8" min="4" max="12" /><div id="divnumview"></div>
        </div>

        <div class="row">
        <input type="range" min="0" max="30" value="0" id="startcount" /><div id="startcountview"></div>
        </div>
        <div class="row">
        <input type="range" min="1" max="30" value="1" id="addcount" /><div id="addcountview"></div>
        </div>
        <div class="row">
        <input type="range" min="1" max="30" value="10" id="outcount" /><div id="outcountview"></div>
        </div>
        </div>

        <button class="pointer" id="openfile">ファイルを開く</button>
        <button class="pointer" id="opendir">ワーキングフォルダを指定して processDir() も実行</button>
        <button class="pointer" id="selectdir">ワーキングフォルダーを選択する</button>
        <div id="rootview"></div>
        <button class="pointer" id="parsebin">binパース</button>

        <div>image id</div>
        <input class="num6" id="targetimageid" type="number" min="0" value="1" />
        <label class="pointer"><input type="checkbox" class="pointer" id="eachply" />plyは個別にダウンロードする</label>
        <label class="pointer"><input type="checkbox" class="pointer" id="addtopoints3d" />points3D.bin に足していく</label>

        <button class="pointer" id="onewithcolmap">□ colmap とあわせて3D点を追加する</button>

        <button class="pointer" id="cutdepth">奥行き depth 取り出し</button>
        <button class="pointer" id="inferscale">スケール比を推測する</button>
        <input class="num6" id="scale" value="0.0434" />

        <input id="source" value="src" />
        <input id="destination" value="dst" />
        <button class="pointer" id="downloadbut">ダウンロードする</button>
        <label class="pointer">
<input type="checkbox" class="pointer" id="isdel" />
重複を消す</label>

        <div>
          <div class="row">
            <details open>
              <summary class="pointer">base</summary>
              <img id="baseimage" />
            </details>
            <details open>
              <summary class="pointer">apply</summary>
              <img id="candimage" />
            </details>
          </div>

          <div id="processingview" class="aaarow"></div>

        </div>
      </div>
    </div>

    <div>
      <template id="oneframe">
        <div class="oneframe row">
          <div class="index"></div>
          <label class="pointer">
<input type="checkbox" class="pointer enable" />
<span class="name"></span>
</label>
          <div class="offset" hidden></div>
          <div class="end" hidden></div>
          <input class="delayTime pointer" type="range" value="100" min="0" max="200" />
          <div class="delayTimeview"></div>
        </div>
      </template>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>

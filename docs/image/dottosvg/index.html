<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>dot to svg</title>
    <link rel="stylesheet" href="./index.css" />

  </head>
  <body>

    <div>
      <div>
        <canvas id="srccanvas"></canvas>
        <canvas id="lookcanvas"></canvas>
        <canvas id="canvas"></canvas>
        <label class="pointer"><input class="pointer" type="checkbox" id="limitarea" />制限する</label>
        <input type="number" min="0" max="1024" value="0" id="offsetx" />
        <input type="number" min="0" max="1024" value="0" id="offsety" />
        <input type="number" min="1" max="1024" value="9" id="pwidth" />
        <input type="number" min="1" max="1024" value="9" id="pheight" />  
        <div>
          <div id="processingview"></div>
        </div>
      </div>
      <div>
        <div id="actprocess" class="drop">ここにドロップする</div>
        <label class="pointer"><input type="checkbox" class="pointer" id="isdownload" />ダウンロードもする</label>
        <button class="pointer" id="retry">再処理する</button>
        <!--
        <img src="./mosaic.png" id="allcircle" />
      -->
        <label class="pointer"><input type="checkbox" class="pointer" id="iscustom" />カスタム処理する</label>

        <button hidden class="pointer" id="retryall">全処理</button>
      </div>
      <div>
        <div id="resultelement"></div>
      </div>

    </div>

    <hr />

    <script type="module" src="./index.js"></script>
  </body>
</html>

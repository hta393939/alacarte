<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>gif変更する</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div>

      <div>
        <div id="startfile" class="drop">ここにファイルをドロップ</div>

        <input type="number" min="0" max="30" value="0" id="startcount" />
        <input type="number" min="1" max="30" value="1" id="addcount" />
        <input type="number" min="1" max="30" value="10" id="outcount" />

        <button id="openwindow">開く</button>
        <button class="pointer" id="opendir">ワーキングフォルダを指定する ←</button>
        <div id="rootview"></div>

        <input id="source" value="src" />
        <input id="destination" value="dst" />
        <button class="pointer" id="applybut">反映する</button>
        <button class="pointer" id="downloadbut">ダウンロードする</button>
        <label class="pointer">
<input type="checkbox" class="pointer" id="isdel" />
重複を消す</label>

        <div>
          <div id="processingview"></div>
          <div>
            <img id="baseimage" />
            <img id="candimage" />
          </div>
        </div>
      </div>
    </div>

    <div>
      <template id="oneframe">
        <div class="oneframe row">
          <div class="index"></div>
          <label class="pointer">
<input checked type="checkbox" class="pointer" />
<span class="name"></span>
</label>
          <div class="offset"></div>
          <div class="end"></div>
          <input class="delaytime" type="slider" value="100" min="0" max="200" />
        </div>
      </template>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
